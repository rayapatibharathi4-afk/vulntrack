services:
  postgres:
    image: postgres:16
    container_name: vulntrack-postgres
    environment:
      POSTGRES_DB: vulntrack
      POSTGRES_USER: vulntrack
      POSTGRES_PASSWORD: vulntrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulntrack -d vulntrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: