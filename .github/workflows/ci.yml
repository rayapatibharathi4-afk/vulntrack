name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new CVEs are found even when no code changes
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # No service containers: the tests start PostgreSQL and Kafka with Testcontainers.
    # GitHub's Ubuntu runners include Docker.

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify

  dependency-check:
    # Slow (downloads the NVD database), so it runs on pushes to main and weekly, not on every pull request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check that the NVD key is set
        # Dependency-Check 13 refuses to start without an NVD API key, so say so clearly instead of failing in the scanner
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::The NVD_API_KEY repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: OWASP Dependency-Check (fails on CVSS 7.0 or higher)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Psecurity-scan org.owasp:dependency-check-maven:check

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore