spring.application.name=vulntrack

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/vulntrack
spring.datasource.username=vulntrack
spring.datasource.password=vulntrack

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Actuator ---
management.endpoint.health.show-details=always
logging.level.org.hibernate.SQL=debug