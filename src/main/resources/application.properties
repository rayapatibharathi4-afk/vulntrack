spring.application.name=vulntrack

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/vulntrack
spring.datasource.username=vulntrack
spring.datasource.password=vulntrack

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Actuator ---
management.endpoint.health.show-details=always
# Metrics for scraping (Prometheus). Public for now; protect before exposing outside the network.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
logging.level.org.hibernate.SQL=debug
# Every log line shows the request's correlation id (empty outside a request)
logging.pattern.level=%5p [%X{correlationId:-}]

# --- NVD API ---
vulntrack.nvd.base-url=https://services.nvd.nist.gov/rest/json/cves/2.0
vulntrack.nvd.api-key=${NVD_API_KEY:}
vulntrack.nvd.connect-timeout=2s
vulntrack.nvd.read-timeout=5s
vulntrack.nvd.request-interval=${NVD_REQUEST_INTERVAL:6s}

# --- CVE enrichment job ---
vulntrack.enrichment.enabled=true
vulntrack.enrichment.initial-delay=10s
vulntrack.enrichment.delay=60s

# --- Security: API keys (empty = that key matches nothing) ---
# VULNTRACK_API_KEY: writes and reads.  VULNTRACK_READ_API_KEY: reads and metrics only.
vulntrack.security.api-key=${VULNTRACK_API_KEY:}
vulntrack.security.read-api-key=${VULNTRACK_READ_API_KEY:}

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.listener.concurrency=3
spring.kafka.consumer.group-id=vulntrack-scan-processor
spring.kafka.consumer.auto-offset-reset=earliest
vulntrack.scan-consumer.enabled=true